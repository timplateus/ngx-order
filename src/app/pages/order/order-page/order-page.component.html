<oc-header [title]="'Order: ' + (accountName$ | async)">
  @if (hasLatestOrder()) {
    <button
      mat-icon-button
      ocActions
      (click)="openLatestOrderDialog()"
      >
      <mat-icon
        class="latest-order-icon"
        svgIcon="receipt"
        aria-hidden="false"
        aria-label="Show latest order"
      ></mat-icon>
    </button>
  }
</oc-header>
<div class="order-page">
  <main class="order-page__content">
    <mat-tab-group>
      @for (category of categories$ | async; track category) {
        <mat-tab
          [label]="category.name"
          >
          <div class="order-items">
            @for (menuItem of category.menuItems; track menuItem) {
              <div class="order-item">
                <button
                  mat-raised-button
                  color="primary"
                  (click)="addSummaryItem(menuItem.id, menuItem.name)"
                  >
                  {{ menuItem.name }}
                </button>
              </div>
            }
          </div>
        </mat-tab>
      }
    </mat-tab-group>
  </main>
  <aside class="order-page__aside">
    <div class="summary-list">
      @for (item of summaryItems; track item) {
        <oc-summary-item
          [id]="item.id"
          [title]="item.title"
          [amount]="item.amount"
          [menuItemId]="item.menuItemId"
          [remarks]="item.remarks"
          [editMode]="editId === item.id"
          (changed)="onRemarksChanged($event)"
          (click)="toggleEditMode(item.id)"
          (delete)="onDelete(item.id)"
          >
        </oc-summary-item>
      }
    </div>
    <button
      [disabled]="!buttonActive"
      class="submit-order"
      mat-raised-button
      color="accent"
      (click)="submitOrder()"
      >
      Plaats bestelling
    </button>
  </aside>
</div>
