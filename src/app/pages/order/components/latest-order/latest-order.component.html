<h2 mat-dialog-title>Laatste bestelling</h2>

<mat-dialog-content>
  <div class="summary-list">
    @for (item of order.items; track item) {
      <oc-summary-item
        [id]="item.id"
        [title]="item.title"
        [amount]="item.amount"
        [menuItemId]="item.menuItemId"
        [remarks]="item.remarks"
        >
      </oc-summary-item>
    }
  </div>
</mat-dialog-content>
