<oc-header [title]="'Overview'"></oc-header>
<div class="overview-content">
  <div class="tables-list">
    @for (tableRow of tables$ | async; track tableRow) {
      <div class="tables-row">
        @for (table of tableRow; track table) {
          <mat-card class="table">
            <mat-card-header>
              <mat-card-title>{{ table.name }}</mat-card-title>
            </mat-card-header>
            <mat-card-content class="card-content">
              <mat-divider></mat-divider>
              @for (account of table.accounts; track account) {
                <button
                  mat-raised-button
                  color="primary"
                  class="account-btn"
                  (click)="goToOrder(account.id, account.name)"
                  >
                  {{ account.name }}
                </button>
              }
            </mat-card-content>
            <mat-card-footer>
              <mat-divider></mat-divider>
              <button
                class="add-account-btn"
                mat-button
                color="primary"
                (click)="openAddDialog(table)"
                >
                Toevoegen
              </button>
            </mat-card-footer>
          </mat-card>
        }
      </div>
    }
  </div>
</div>
